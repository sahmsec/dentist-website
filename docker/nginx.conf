server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # SPA history fallback — React Router owns the routes.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets are immutable; index.html must never be cached.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        # `expires` would emit a second, conflicting Cache-Control alongside
        # this one, so the max-age is written here instead.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
