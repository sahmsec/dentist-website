# nginx does NOT inherit server-level add_header into a location block that
# declares any add_header of its own. Both cache locations below set their own
# Cache-Control, which would silently drop every security header for exactly the
# requests that matter. Keeping them in one file and including it everywhere is
# the only way to be sure they are actually sent.
add_header X-Content-Type-Options "nosniff"                       always;
add_header X-Frame-Options        "SAMEORIGIN"                    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
