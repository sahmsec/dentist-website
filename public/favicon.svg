<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">Dr. Arman's Dental</title>
  <!-- A favicon renders outside the document, where the CSS custom properties
       the rest of the site uses do not exist, so the three brand hexes are
       written out literally here. This is the only file in the project allowed
       to do that. The plate uses the page surface colour, so the mark sits on
       the same ground it does on screen and still separates from a dark
       browser tab at 16px. -->
  <rect width="48" height="48" rx="11" fill="#f1f5f9"/>
  <!-- Same paths as LogoMark in src/components/Logo.jsx, scaled down slightly
       and re-centred so the mark keeps an even margin inside the plate. -->
